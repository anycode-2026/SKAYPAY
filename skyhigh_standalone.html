
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky High - Online Sports Betting & Games</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google GenAI SDK -->
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@0.1.1"
      }
    }
    </script>

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: rgb(0, 21, 41);
            color: white;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        /* Loading Screen Style */
        #loading-screen {
            position: fixed;
            inset: 0;
            background-color: #000a16;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            text-align: center;
            transition: opacity 0.5s ease-out;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #db2777;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #001529; }
        ::-webkit-scrollbar-thumb { background: #1890ff; border-radius: 4px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#001529]">
    <!-- Initial Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <h2 class="text-xl font-bold">LOADING SKY HIGH...</h2>
        <p id="error-log" class="text-xs text-red-400 mt-4 max-w-md px-4 font-mono"></p>
    </div>

    <div id="root"></div>

    <!-- Error Handler -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errorDiv = document.getElementById('error-log');
            if (errorDiv) {
                // If it's a script error from CDN, we might just want to reload or show a specific message
                if(message === "Script error.") {
                     errorDiv.innerText = "Network Error: Failed to load scripts. Please check internet.";
                } else {
                     errorDiv.innerText = message;
                }
            }
        };
    </script>

    <!-- Main Application Script -->
    <script type="text/babel" data-presets="react,typescript" data-type="module">
        import { GoogleGenAI } from "@google/genai";

        // --- CONFIGURATION ---
        const API_KEY = 'AIzaSyBea32n2Yw1tQ15Lnxpq7KlvoQvJ7PRsHI'; 
        
        // Hide loading screen safely
        setTimeout(() => {
            const loader = document.getElementById('loading-screen');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }, 2000);

        // --- COMPONENTS ---

        const Header = ({ isLoggedIn, username, balance, siteTitle, onOpenLogin, onOpenRegister, onLogout, onLogoClick, onOpenDeposit, onOpenWithdraw, onOpenHistory, onOpenBetHistory, onOpenAdmin }) => {
          const [showMenu, setShowMenu] = React.useState(false);
          const menuRef = React.useRef(null);

          React.useEffect(() => {
            const handleClickOutside = (event) => {
              if (menuRef.current && !menuRef.current.contains(event.target)) setShowMenu(false);
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
          }, []);

          return (
            <header className="sticky top-0 z-40 bg-[#000d1a]/95 backdrop-blur-xl border-b border-white/5 px-4 md:px-8 py-2.5">
              <div className="max-w-7xl mx-auto flex justify-between items-center">
                <div className="flex items-center cursor-pointer" onClick={onLogoClick}>
                  <img src="https://aviator.digirg-demo.pp.ua/images/logo.png" alt="Logo" className="h-9" onError={(e) => e.target.style.display='none'} />
                  <span className="ml-2 text-xl font-black text-white uppercase italic">
                    {siteTitle.split(' ')[0]} <span className="text-red-600">{siteTitle.split(' ').slice(1).join(' ')}</span>
                  </span>
                </div>

                <div className="flex items-center gap-3">
                  {!isLoggedIn ? (
                    <div className="flex items-center gap-2">
                      <button onClick={onOpenRegister} className="px-5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-black text-xs uppercase tracking-wider">Join Now</button>
                      <button onClick={onOpenLogin} className="px-5 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-white font-black border border-white/10 text-xs uppercase tracking-wider">Login</button>
                    </div>
                  ) : (
                    <div className="flex items-center gap-3 relative" ref={menuRef}>
                      <div onClick={onOpenDeposit} className="flex items-center gap-2 bg-[#001b36] border border-white/10 px-4 py-1.5 rounded-full cursor-pointer hover:bg-[#002a4d] transition-all">
                        <div className="flex flex-col items-start">
                          <span className="text-[8px] text-gray-500 font-bold uppercase mb-0.5">Balance</span>
                          <span className="text-sm font-black text-white">৳ {balance.toLocaleString()}</span>
                        </div>
                        <div className="w-6 h-6 rounded-full bg-green-500/20 flex items-center justify-center">
                          <span className="material-symbols-outlined text-green-500 text-sm font-bold">add</span>
                        </div>
                      </div>
                      <button onClick={() => setShowMenu(!showMenu)} className="w-10 h-10 rounded-full bg-gradient-to-br from-red-600 to-rose-900 flex items-center justify-center border-2 border-white/10">
                        <span className="material-symbols-outlined text-white text-2xl">person</span>
                      </button>
                      {showMenu && (
                        <div className="absolute right-0 top-14 w-60 bg-[#001529] border border-white/10 rounded-2xl shadow-2xl overflow-hidden z-50">
                          <div className="p-4 border-b border-white/5">
                            <p className="text-[10px] text-gray-400 font-bold uppercase">Authenticated</p>
                            <p className="text-sm text-white font-black italic">{username || 'Player'}</p>
                          </div>
                          <div className="p-2 space-y-1">
                            <button onClick={() => { onOpenDeposit(); setShowMenu(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-green-600/10 text-green-500 text-sm font-bold"><span className="material-symbols-outlined">add_circle</span> Deposit</button>
                            <button onClick={() => { onOpenWithdraw(); setShowMenu(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-orange-600/10 text-orange-500 text-sm font-bold"><span className="material-symbols-outlined">account_balance_wallet</span> Withdraw</button>
                            <button onClick={() => { onOpenBetHistory(); setShowMenu(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-purple-600/10 text-purple-500 text-sm font-bold"><span className="material-symbols-outlined">casino</span> Bet History</button>
                            <button onClick={() => { onOpenHistory(); setShowMenu(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-blue-600/10 text-blue-500 text-sm font-bold"><span className="material-symbols-outlined">history</span> Transactions</button>
                            {onOpenAdmin && <button onClick={() => { onOpenAdmin(); setShowMenu(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 text-gray-400 text-sm font-bold border-t border-white/5 mt-1"><span className="material-symbols-outlined">admin_panel_settings</span> Admin Panel</button>}
                            <div className="my-1 border-t border-white/5"></div>
                            <button onClick={() => { onLogout(); setShowMenu(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-red-600/20 text-red-500 text-sm font-bold"><span className="material-symbols-outlined">logout</span> Logout</button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </header>
          );
        };

        const Footer = () => (
          <footer className="bg-[#001529] border-t border-white/5 pt-12 pb-8 px-4">
            <div className="max-w-7xl mx-auto">
              <div className="flex flex-col md:flex-row justify-between items-center gap-8 mb-12">
                <div className="text-center md:text-left">
                  <img src="https://aviator.digirg-demo.pp.ua/images/logo.png" className="h-10 mx-auto md:mx-0 mb-4" alt="Logo" onError={(e) => e.target.style.display='none'} />
                  <p className="text-gray-400 text-sm max-w-sm">Providing top-tier gaming experiences since 2021.</p>
                </div>
                <div className="flex gap-4">
                    <span className="text-2xl font-black text-gray-600 border-2 border-gray-600 rounded px-2">18+</span>
                </div>
              </div>
              <div className="text-center text-gray-500 text-xs">&copy; 2024 SKY HIGH. All rights reserved.</div>
            </div>
          </footer>
        );

        const AuthModals = ({ activeModal, onClose, onSwitch, onAuthAction }) => {
          const [showPass, setShowPass] = React.useState(false);
          const [email, setEmail] = React.useState('');
          const [password, setPassword] = React.useState('');
          const [fullname, setFullname] = React.useState('');

          if (!activeModal) return null;

          const handleSubmit = (e) => {
            e.preventDefault();
            if (activeModal === 'login') onAuthAction('login', { email, password });
            else if (activeModal === 'register') onAuthAction('register', { email, password, fullname });
          };

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="w-full max-w-md bg-[#001529] rounded-2xl border border-white/10 p-8">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-2xl font-black text-white uppercase">{activeModal}</h2>
                  <button onClick={onClose}><span className="material-symbols-outlined text-gray-400">close</span></button>
                </div>
                <form className="space-y-4" onSubmit={handleSubmit}>
                  {activeModal === 'register' && (
                    <input type="text" value={fullname} onChange={e => setFullname(e.target.value)} placeholder="Full Name" className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white" required />
                  )}
                  <input type="text" value={email} onChange={e => setEmail(e.target.value)} placeholder="Email" className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white" required />
                  <div className="relative">
                    <input type={showPass ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white" required />
                    <button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-3 top-3 text-gray-500"><span className="material-symbols-outlined text-lg">{showPass ? 'visibility' : 'visibility_off'}</span></button>
                  </div>
                  <button type="submit" className="w-full py-4 rounded-xl font-black bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg uppercase tracking-wider">
                    {activeModal === 'login' ? 'LOGIN' : 'START GAME'}
                  </button>
                </form>
                <div className="mt-6 text-center">
                  <button onClick={() => onSwitch(activeModal === 'login' ? 'register' : 'login')} className="text-sm font-bold text-white hover:text-blue-400">
                     {activeModal === 'login' ? "Don't have an account? Register" : "Already have an account? Login"}
                  </button>
                </div>
              </div>
            </div>
          );
        };

        const LandingPage = ({ onPlay }) => {
          const [withdrawals, setWithdrawals] = React.useState([]);

          React.useEffect(() => {
            const interval = setInterval(() => {
              const prefixes = ['017', '019', '018', '013'];
              const newUser = prefixes[Math.floor(Math.random() * prefixes.length)] + '***' + Math.floor(10 + Math.random() * 89);
              const newAmt = '৳' + [1200, 2500, 5000, 12000].sort(() => .5 - Math.random())[0].toLocaleString();
              setWithdrawals(prev => [{ user: newUser, amt: newAmt, time: 'Just now' }, ...prev.slice(0, 3)]);
            }, 3000);
            return () => clearInterval(interval);
          }, []);

          return (
            <div className="relative w-full overflow-hidden bg-[#000a16] pb-10">
              <div className="relative min-h-[50vh] flex items-center justify-center py-6 text-center px-4">
                <div className="relative z-20 space-y-4">
                  <img src="https://aviator.digirg-demo.pp.ua/code-by-digirg-cloud/home.jpg" className="w-44 mx-auto rounded-[32px] shadow-2xl border border-white/10" alt="Hero" onError={(e) => e.target.style.display='none'} />
                  <h1 className="text-5xl font-black text-white italic tracking-tighter">SKY <span className="text-red-600">HIGH</span></h1>
                  <button onClick={onPlay} className="px-14 py-4 font-black text-white bg-red-600 rounded-full shadow-2xl hover:scale-105 transition-transform uppercase tracking-widest">START GAME</button>
                </div>
              </div>
              <div className="mx-4 p-5 bg-[#001529] rounded-[24px] border border-white/10 shadow-2xl">
                 <h3 className="text-white font-black text-[10px] uppercase tracking-widest mb-4">Live Payouts</h3>
                 <div className="space-y-2">
                    {withdrawals.map((w, i) => (
                       <div key={i} className="flex justify-between items-center bg-black/40 p-3 rounded-xl border border-white/5 animate-pulse">
                          <span className="text-[10px] font-bold text-gray-400">{w.user}</span>
                          <span className="text-[10px] font-black text-green-500">{w.amt}</span>
                       </div>
                    ))}
                 </div>
              </div>
            </div>
          );
        };

        const GameView = ({ balance, setBalance, onRecordBet, forcedCrashPoint, onConsumeCrashPoint, isMuted = false }) => {
          const [multiplier, setMultiplier] = React.useState(1.00);
          const [gameState, setGameState] = React.useState('betting');
          const [countdown, setCountdown] = React.useState(5);
          const [history, setHistory] = React.useState([1.2, 5.4, 1.1, 20.5]);
          const [winModal, setWinModal] = React.useState(null);
          const [bet, setBet] = React.useState({ amount: 100, active: false, cashedOut: false });
          
          const canvasRef = React.useRef(null);
          const crashPoint = React.useRef(1.5);
          const crashProcessed = React.useRef(false);
          const audioCtx = React.useRef(null);
          const visualMultiplierRef = React.useRef(1.00);
          const isQuotaExceeded = React.useRef(false); // Track quota status

          // NATIVE BROWSER TTS FALLBACK
          const playNativeTTS = (text) => {
             if(isMuted) return;
             const utterance = new SpeechSynthesisUtterance(text);
             utterance.rate = 1.1;
             utterance.pitch = 1.1;
             // Try to use a female voice if available
             const voices = window.speechSynthesis.getVoices();
             const female = voices.find(v => v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Google US English'));
             if(female) utterance.voice = female;
             window.speechSynthesis.speak(utterance);
          };

          const playSound = async (type) => {
             if(isMuted) return;
             
             // Initialize Audio Context safely on user interaction
             try {
                if(!audioCtx.current) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx.current = new AudioContext({sampleRate: 24000});
                }
                if(audioCtx.current && audioCtx.current.state === 'suspended') {
                    await audioCtx.current.resume();
                }
             } catch(e) { console.log("Audio Init Error"); }

             if(!audioCtx.current) return;
             const ctx = audioCtx.current;

             // TTS Logic
             if (typeof type === 'string' && type.startsWith('speak:')) {
                const text = type.replace('speak:', '');
                
                // If quota already exceeded, skip API and use Native
                if (isQuotaExceeded.current) {
                    playNativeTTS(text);
                    return;
                }

                try {
                  const ai = new GoogleGenAI({ apiKey: API_KEY });
                  const response = await ai.models.generateContent({
                    model: "gemini-2.5-flash-preview-tts",
                    contents: [{ parts: [{ text: text }] }],
                    config: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Kore' } } } },
                  });
                  const base64Audio = response.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                  if (base64Audio) {
                    const binaryString = atob(base64Audio);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const dataInt16 = new Int16Array(bytes.buffer);
                    const buffer = ctx.createBuffer(1, dataInt16.length, 24000);
                    const channelData = buffer.getChannelData(0);
                    for (let i = 0; i < dataInt16.length; i++) channelData[i] = dataInt16[i] / 32768.0;
                    const source = ctx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(ctx.destination);
                    source.start();
                  }
                } catch (e) { 
                    console.warn("Gemini API Error (Quota/Network), switching to Native TTS:", e);
                    isQuotaExceeded.current = true; // Enable fallback for future
                    playNativeTTS(text); // Play now using native
                }
                return;
             }

             // Beep Sounds
             const osc = ctx.createOscillator();
             const gain = ctx.createGain();
             osc.connect(gain); gain.connect(ctx.destination);
             
             if (type === 'crash') { 
                osc.frequency.value = 100; gain.gain.value = 0.5; osc.start(); osc.stop(ctx.currentTime + 0.5); 
             } else if (type === 'cashout') { 
                osc.frequency.value = 800; gain.gain.value = 0.1; osc.start(); osc.stop(ctx.currentTime + 0.2); 
             }
          };

          React.useEffect(() => {
            let interval;
            if (gameState === 'betting') {
              visualMultiplierRef.current = 1.00;
              crashProcessed.current = false;
              if (countdown === 5) {
                  playSound('speak:Please place your bets');
              }
              if (countdown > 0) interval = setTimeout(() => setCountdown(p => p - 1), 1000);
              else {
                 if(forcedCrashPoint) { crashPoint.current = forcedCrashPoint; onConsumeCrashPoint(); }
                 else crashPoint.current = 1.00 + Math.random() * 10;
                 setGameState('flying');
                 setMultiplier(1.00);
                 playSound('speak:Ready for takeoff');
                 setBet(b => ({...b, cashedOut: false}));
              }
            } else if (gameState === 'flying') {
              interval = setInterval(() => {
                setMultiplier(prev => {
                  const next = prev * 1.008;
                  if (next >= crashPoint.current) {
                    if (!crashProcessed.current) {
                       crashProcessed.current = true;
                       setGameState('crashed');
                       playSound('crash');
                       playSound('speak:Flew away');
                       setHistory(h => [parseFloat(next.toFixed(2)), ...h.slice(0, 8)]);
                       if(bet.active && !bet.cashedOut) onRecordBet({ amount: bet.amount, multiplier: next, status: 'loss', payout: 0 });
                       setBet(b => ({...b, active: false}));
                       setTimeout(() => { setGameState('betting'); setCountdown(5); }, 3000);
                    }
                    return next;
                  }
                  return next;
                });
              }, 20);
            }
            return () => { clearTimeout(interval); clearInterval(interval); }
          }, [gameState, countdown, forcedCrashPoint]);

          const handlePlaceBet = () => {
             if(balance < bet.amount) return alert("Insufficient Balance");
             setBalance(b => b - bet.amount);
             setBet(b => ({...b, active: true}));
             playSound('speak:Bet Accepted');
          };
          const handleCashOut = () => {
             if(bet.active && !bet.cashedOut) {
                const win = bet.amount * multiplier;
                setBalance(b => b + win);
                setBet(b => ({...b, cashedOut: true, active: false}));
                setWinModal({show: true, amount: win});
                onRecordBet({ amount: bet.amount, multiplier, status: 'win', payout: win });
                playSound('cashout');
                playSound('speak:Cashout Successful');
                setTimeout(() => setWinModal(null), 2000);
             }
          }

          React.useEffect(() => {
             const ctx = canvasRef.current?.getContext('2d');
             if(!ctx) return;
             const draw = () => {
                ctx.clearRect(0,0,450,170);
                if(gameState === 'flying') {
                   const x = (multiplier - 1) * 20; 
                   ctx.beginPath(); ctx.strokeStyle = 'red'; ctx.lineWidth = 4; ctx.moveTo(0, 170); ctx.lineTo(x, 170 - x/2); ctx.stroke();
                }
                requestAnimationFrame(draw);
             }
             draw();
          }, [multiplier, gameState]);

          return (
            <div className="w-full max-w-[370px] mx-auto px-2 py-2 space-y-2">
              <div className="flex gap-1.5 p-2 bg-black/50 rounded-xl overflow-x-auto scrollbar-hide border border-white/5 shadow-inner">
                {history.map((val, i) => <div key={i} className={`flex-shrink-0 px-2.5 py-1 rounded-lg text-[10px] font-black border ${val > 2 ? 'border-purple-500/40 text-purple-400' : 'border-blue-500/40 text-blue-400'}`}>{val.toFixed(2)}x</div>)}
              </div>
              <div className="relative bg-[#000d1a] rounded-[24px] border border-white/10 overflow-hidden shadow-2xl h-[170px]">
                 <div className="absolute inset-0 flex items-center justify-center z-10">
                    {gameState === 'betting' ? <h2 className="text-5xl font-black text-white">{countdown}s</h2> : <h1 className={`text-[60px] font-black italic ${gameState === 'crashed' ? 'text-red-600' : 'text-white'}`}>{multiplier.toFixed(2)}x</h1>}
                 </div>
                 <canvas ref={canvasRef} width={450} height={170} className="w-full h-full" />
              </div>
              <div className="bg-[#001b36]/95 backdrop-blur-xl p-4 rounded-[32px] border border-white/10 shadow-2xl space-y-4">
                 <div className="flex gap-2">
                    <input type="number" value={bet.amount} onChange={e => setBet({...bet, amount: parseInt(e.target.value)})} className="bg-black/40 rounded-xl p-3 text-white w-1/2" />
                    {gameState === 'flying' && bet.active && !bet.cashedOut ? 
                       <button onClick={handleCashOut} className="w-1/2 bg-orange-500 rounded-xl font-black text-white">CASH OUT</button> :
                       <button onClick={handlePlaceBet} disabled={bet.active} className="w-1/2 bg-green-600 rounded-xl font-black text-white">BET</button>
                    }
                 </div>
              </div>
              {winModal && <div className="fixed inset-0 z-50 flex items-center justify-center pointer-events-none"><div className="bg-black/90 p-6 rounded-2xl border border-green-500 text-center"><h2 className="text-3xl text-green-500 font-black">৳ {winModal.amount.toFixed(2)}</h2></div></div>}
            </div>
          );
        };

        const DepositModal = ({ onClose, onSuccess }) => {
            const [step, setStep] = React.useState(1);
            const [amount, setAmount] = React.useState(1000);
            return (
               <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4">
                  <div className="bg-[#000d1a] rounded-2xl w-full max-w-sm p-6 border border-white/10">
                     <h3 className="text-white font-bold mb-4">Deposit Funds</h3>
                     {step === 1 ? (
                        <>
                           <input type="number" value={amount} onChange={e => setAmount(parseInt(e.target.value))} className="w-full bg-black p-3 text-white rounded mb-4" />
                           <button onClick={() => setStep(2)} className="w-full bg-red-600 p-3 rounded text-white font-bold">Next</button>
                        </>
                     ) : (
                        <div className="text-center">
                           <p className="text-white mb-4">Send to: 01700000000 (Bkash)</p>
                           <button onClick={() => { onSuccess(amount, 'Bkash'); onClose(); }} className="w-full bg-green-600 p-3 rounded text-white font-bold">Confirm</button>
                        </div>
                     )}
                     <button onClick={onClose} className="mt-4 text-gray-500 text-sm w-full">Close</button>
                  </div>
               </div>
            );
        };

        const AdminPanel = ({ transactions, settings, onClose, onAction, onUpdateSettings, onManageUsers, allUsers }) => {
            const [tab, setTab] = React.useState('users');
            const [newCrash, setNewCrash] = React.useState('');
            
            return (
               <div className="fixed inset-0 z-[100] bg-black text-white overflow-auto p-4">
                  <div className="max-w-4xl mx-auto">
                     <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-black text-red-600">ADMIN PANEL</h2>
                        <button onClick={onClose} className="text-gray-400">Close</button>
                     </div>
                     <div className="flex gap-4 mb-6 border-b border-gray-800 pb-2">
                        <button onClick={() => setTab('users')} className={tab === 'users' ? 'text-white font-bold' : 'text-gray-500'}>Users</button>
                        <button onClick={() => setTab('game')} className={tab === 'game' ? 'text-white font-bold' : 'text-gray-500'}>Game</button>
                     </div>
                     {tab === 'users' && (
                        <div>
                           <h3 className="text-lg font-bold mb-4">User Database</h3>
                           {allUsers && allUsers.map((u, i) => (
                              <div key={i} className="flex justify-between bg-gray-900 p-3 mb-2 rounded border border-gray-800">
                                 <div><p className="font-bold">{u.email}</p><p className="text-xs text-gray-400">Pass: {u.password}</p></div>
                                 <div className="text-right"><p className="text-green-500">৳{u.balance}</p>
                                    <button onClick={() => onManageUsers('delete', {email: u.email})} className="text-red-500 text-xs ml-2">Delete</button>
                                 </div>
                              </div>
                           ))}
                        </div>
                     )}
                     {tab === 'game' && (
                        <div className="bg-gray-900 p-6 rounded">
                           <h3 className="text-lg font-bold mb-4">Rig Game Outcome</h3>
                           <input type="number" placeholder="Crash Point (e.g. 1.5)" value={newCrash} onChange={e => setNewCrash(e.target.value)} className="bg-black p-2 text-white border border-gray-700 mr-2" />
                           <button onClick={() => { onUpdateSettings({...settings, forcedCrashPoint: parseFloat(newCrash)}); alert('Set!'); }} className="bg-red-600 px-4 py-2 rounded font-bold">Set Next Crash</button>
                        </div>
                     )}
                  </div>
               </div>
            );
        };

        const App = () => {
          const [currentUser, setCurrentUser] = React.useState(null);
          const [showGame, setShowGame] = React.useState(false);
          const [activeModal, setActiveModal] = React.useState(null);
          const [showDeposit, setShowDeposit] = React.useState(false);
          const [showAdmin, setShowAdmin] = React.useState(false);
          const [usersDB, setUsersDB] = React.useState({});
          const [adminSettings, setAdminSettings] = React.useState({ forcedCrashPoint: null });

          React.useEffect(() => {
             const saved = localStorage.getItem('skyhigh_users_db');
             if(saved) setUsersDB(JSON.parse(saved));
          }, []);

          const saveDB = (newDB) => {
             setUsersDB(newDB);
             localStorage.setItem('skyhigh_users_db', JSON.stringify(newDB));
          }

          const handleAuth = (type, data) => {
             const newDB = {...usersDB};
             if(type === 'register') {
                if(newDB[data.email]) return alert("Exists");
                newDB[data.email] = { ...data, balance: 0, transactions: [] };
                saveDB(newDB);
                setCurrentUser(newDB[data.email]);
             } else if(type === 'login') {
                if(data.email === 'SkyOwner' && data.password === 'SkyHigh@2025') { setShowAdmin(true); return; }
                if(newDB[data.email] && newDB[data.email].password === data.password) setCurrentUser(newDB[data.email]);
                else return alert("Invalid");
             }
             setActiveModal(null);
             setShowGame(true);
          }

          const handleLogout = () => { setCurrentUser(null); setShowGame(false); }
          
          const updateBalance = (newBal) => {
             if(!currentUser) return;
             const val = typeof newBal === 'function' ? newBal(currentUser.balance) : newBal;
             const updated = { ...currentUser, balance: val };
             setCurrentUser(updated);
             const newDB = {...usersDB};
             newDB[currentUser.email] = updated;
             saveDB(newDB);
          }

          const manageUsers = (action, payload) => {
              const newDB = {...usersDB};
              if(action === 'delete') delete newDB[payload.email];
              saveDB(newDB);
          }

          return (
            <div className="min-h-screen flex flex-col bg-[#000a16]">
              <Header 
                isLoggedIn={!!currentUser} 
                username={currentUser?.name} 
                balance={currentUser?.balance || 0} 
                siteTitle="SKY HIGH"
                onOpenLogin={() => setActiveModal('login')}
                onOpenRegister={() => setActiveModal('register')}
                onLogout={handleLogout}
                onLogoClick={() => setShowGame(false)}
                onOpenDeposit={() => setShowDeposit(true)}
                onOpenAdmin={() => setShowAdmin(true)}
              />
              
              <main className="flex-grow flex flex-col items-center justify-center">
                 {showGame && currentUser ? 
                    <GameView 
                       balance={currentUser.balance} 
                       setBalance={updateBalance} 
                       onRecordBet={() => {}} 
                       forcedCrashPoint={adminSettings.forcedCrashPoint}
                       onConsumeCrashPoint={() => setAdminSettings(s => ({...s, forcedCrashPoint: null}))}
                       isMuted={showAdmin}
                    /> : 
                    <LandingPage onPlay={() => currentUser ? setShowGame(true) : setActiveModal('login')} />
                 }
              </main>

              {!showGame && <Footer />}
              
              <AuthModals activeModal={activeModal} onClose={() => setActiveModal(null)} onSwitch={setActiveModal} onAuthAction={handleAuth} />
              {showDeposit && <DepositModal onClose={() => setShowDeposit(false)} onSuccess={(amt) => updateBalance(b => b + amt)} />}
              {showAdmin && <AdminPanel onClose={() => setShowAdmin(false)} allUsers={Object.values(usersDB)} onManageUsers={manageUsers} settings={adminSettings} onUpdateSettings={setAdminSettings} />}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
